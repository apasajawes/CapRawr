[package]
name = "caprawr"
version = "0.1.0"
edition = "2024"
description = "CapRawr — Video editor built in Rust"
license = "MIT"

[dependencies]
# GUI
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization (project files)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image handling
image = "0.25"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

# File dialogs
rfd = "0.15"

# UUID for clip/track IDs
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
strip = true
